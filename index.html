<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QQ飞车小工具</title>
    <meta name="description" content="QQ飞车小工具：滴血赛 / 积分赛，选图与计分实时跟踪">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%231377EB%27%2F%3E%3Crect%20x%3D%2713%27%20y%3D%2713%27%20width%3D%2738%27%20height%3D%2726%27%20fill%3D%27%23fff%27%2F%3E%3Crect%20x%3D%2713%27%20y%3D%2713%27%20width%3D%2712.7%27%20height%3D%278.7%27%20fill%3D%27%231377EB%27%2F%3E%3Crect%20x%3D%2725.7%27%20y%3D%2721.7%27%20width%3D%2712.7%27%20height%3D%278.7%27%20fill%3D%27%231377EB%27%2F%3E%3Crect%20x%3D%2738.3%27%20y%3D%2713%27%20width%3D%2712.7%27%20height%3D%278.7%27%20fill%3D%27%231377EB%27%2F%3E%3Crect%20x%3D%2725.7%27%20y%3D%2730.3%27%20width%3D%2712.7%27%20height%3D%278.7%27%20fill%3D%27%231377EB%27%2F%3E%3Cpath%20d%3D%27M13%2039h38v5H13z%27%20fill%3D%27%2313C2F2%27%2F%3E%3Crect%20x%3D%2721%27%20y%3D%2744%27%20width%3D%2722%27%20height%3D%275%27%20rx%3D%272.5%27%20fill%3D%27%23fff%27%2F%3E%3C%2Fsvg%3E">
    <style>
* {margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body {
  background: url("assets/hou/bj.jpg") no-repeat center center fixed;
  background-size: cover;
  color:#ffffff;
  min-height:100vh;
  padding: 30px 24px;
}
.header {text-align:center;margin-bottom: 24px;}
#mainContent { display: none; }
.trophy-title {
  font-size:36px;
  font-weight:bold;
  color: #E6F7FF;
  text-shadow: 0 2px 10px rgba(0,100,200,0.3);
}
.sub-title {
  background:#13C2F244;
  color: #E6F7FF;
  padding:6px 24px;
  border-radius:8px;
  margin-top:8px;
  display:inline-block;
}

.main {
  max-width: 1360px;
  margin:0 auto;
  display:flex;
  gap: 28px;
}
.rank-sidebar {
  width:240px;
  flex-shrink:0;
  background: rgba(255, 255, 255, 0.88);
  border:1px solid #B3E0FF;
  border-radius:16px;
  padding: 18px;
  backdrop-filter: blur(4px);
  color:#222;
  overflow-y:auto;
  max-height:calc(100vh - 160px);
  position:sticky;
  top:20px;
}
.rank-sidebar h3 {
  margin-bottom: 10px;
  color: #1377EB;
  font-size: 15px;
  text-align: center;
}
.rank-sidebar .dixue-subtitle {
  text-align: center;
  color: #E02020;
  font-size: 12px;
  margin: -4px 0 10px;
}
.box h3 { margin-bottom: 10px; }
#mapCount { margin-left: auto; }
.left {flex:1;}
.right {width: 400px;display:flex;flex-direction:column;}

.box {
  background: rgba(255, 255, 255, 0.88);
  border:1px solid #B3E0FF;
  border-radius:16px;
  padding: 24px;
  margin-bottom: 28px;
  color:#222;
  backdrop-filter: blur(4px);
}
.filter-bar {display:flex;gap:12px;margin-bottom:24px;align-items:center;flex-wrap:wrap;}
.filter-btn {
  padding:8px 16px;
  border-radius:30px;
  border:1px solid #13C2F2;
  background:#ffffff00;
  color:#1377EB;
  cursor:pointer;
}
.filter-btn.active {
  background:#13C2F2;
  color:#fff;
}

.draw-box {display:flex;gap:36px;align-items:center;justify-content:center;flex-wrap:wrap;}
.show-card {
  width:320px;
  height:180px;
  border-radius:12px;
  overflow:hidden;
  background:#fff;
  position:relative;
  border: 1px solid #B3E0FF;
  flex-shrink:0;
}
.show-card img {width:100%;height:100%;object-fit:cover;}
.show-card .name {
  position:absolute;
  bottom:0;
  width:100%;
  background:#13C2F288;
  color:#fff;
  padding:8px;
  text-align:center;
}
.draw-btn {
  padding:18px 36px;
  border:none;
  border-radius:16px;
  background:#13C2F2;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}
.draw-btn:hover {
  background: #0EA8E0;
}
.draw-actions {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.repeat-toggle {
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#EAF7FF;
  border:1.5px solid #13C2F2;
  border-radius:20px;
  padding:8px 16px;
  color:#0E6FA8;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  user-select:none;
}
.repeat-toggle input[type="checkbox"] {
  width:20px;
  height:20px;
  accent-color:#13C2F2;
  cursor:pointer;
}

.map-grid {display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px;}
.map-item {
  background:#fff;
  border-radius:8px;
  overflow:hidden;
  border: 1px solid #E6F7FF;
}
.map-item img {width:100%;height:70px;object-fit:cover;}
.map-item .text {padding:4px;font-size:12px;text-align:center;color:#333;}
.map-item.drawn {opacity:0.35;filter:grayscale(1);pointer-events:none;}

.score-panel {flex:1;overflow-y:auto;min-height:400px;}
.panel-title {text-align:center;margin-bottom:16px;font-size:18px;color:#1377EB;}
.score-settings-btn {
  vertical-align:middle;
  margin-left:6px;
  border:none;
  background:transparent;
  color:#1377EB;
  font-size:16px;
  cursor:pointer;
  padding:2px 8px;
  border-radius:8px;
}
.score-settings-btn:hover { background:#E3F4FF; }
/* 分值自定义弹窗 */
#scoreSetOverlay, #scoreSetOverlay .modal-box { transition:none; }
.score-set-box { max-width:420px; }
.score-set-title { font-size:17px; font-weight:700; color:#1377EB; text-align:center; margin-bottom:14px; }
.score-set-sec { border-radius:12px; padding:12px; margin-bottom:12px; }
.score-set-sec.add-sec { background:#E3F4FF; border:1px solid #B3E0FF; }
.score-set-sec.sub-sec { background:#fff; border:1px solid #D8D8D8; }
.score-set-sec .sec-label { font-size:13px; font-weight:700; margin-bottom:10px; }
.score-set-sec.add-sec .sec-label { color:#0E6FA8; }
.score-set-sec.sub-sec .sec-label { color:#555; }
.score-set-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
.score-set-grid label, .score-set-sec.sub-sec label { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; color:#444; }
.score-set-grid input, .score-set-sec.sub-sec input {
  width:100%; box-sizing:border-box; text-align:center;
  border:1px solid #B3E0FF; border-radius:8px; padding:6px 2px; font-size:14px;
}
.score-set-sec.sub-sec input { border-color:#CCC; max-width:90px; }
.score-set-tip { font-size:12px; color:#777; text-align:center; margin-bottom:10px; }
.add-player {display:flex;gap:8px;margin-bottom:16px;}
.add-player input {
  flex:1;
  padding:8px;
  border-radius:6px;
  border:1px solid #B3E0FF;
  background:#fff;
  color:#222;
}
.add-player button {
  padding:8px 12px;
  background:#13C2F2;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.init-score {
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:16px;
  color:#1377EB;
  font-size:14px;
}
.init-score input {
  width:80px;
  padding:6px 8px;
  border-radius:6px;
  border:1px solid #B3E0FF;
  background:#fff;
  color:#222;
  text-align:center;
}
.export-btn {
  margin-left:auto;
  padding:6px 14px;
  background:#1377EB;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:13px;
  cursor:pointer;
  transition:0.2s;
}
.export-btn:hover {
  background:#0D5FC5;
}

.player-item {
  background:#F7FCFF;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  transition:0.2s;
  border:2px solid #E6F7FF;
}
.player-item.active {
  border-color:#13C2F2;
  background:#E6F7FF;
}
.player-name {
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#1377EB;
}
.player-score {
  color:#13C2F2;
  margin-top:4px;
}
.btn-row {
  display:flex;
  gap:6px;
  margin-top:8px;
}
.btn-row button {
  flex:1;
  padding:6px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#fff;
  color:#222;
  border: 1px solid #B3E0FF;
}
.btn-row .add {background:#13C2F2;color:#fff;border-color:#13C2F2;}
.btn-row .sub {background:#fff;color:#1377EB;border:1px solid #13C2F2;}
.btn-row .del {background:#ff4d4f;color:#fff;flex:0.6;}
.btn-row .del:hover {background:#e0393b;}

.manual-map {
  width:100%;
  margin-top:8px;
  padding:6px;
  border-radius:6px;
  background:#fff;
  color:#222;
  border:1px solid #B3E0FF;
}
.add-manual-btn, [data-action="addMap"] {
  width:100%;
  margin-top:6px;
  padding:6px;
  border-radius:6px;
  background:#13C2F2;
  color:#fff;
  border:none;
  cursor:pointer;
}

.map-history {
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid #E6F7FF;
  font-size:12px;
  color:#1377EB;
  line-height:1.4;
}
.map-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:2px 0;
}
.map-row span {flex:1;}
.del-map {
  background:none;
  border:none;
  color:#ff4d4f;
  font-size:16px;
  cursor:pointer;
  padding:0 4px;
  line-height:1;
}
.del-map:hover {color:#e0393b;}

.ctrl-group {display:flex;gap:8px;margin-top:16px;}
.ctrl-group button {
  flex:1;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  background:#13C2F2;
  color:#fff;
  border:none;
}
.ctrl-group .reset {background:#6BB7EF;}

@keyframes rolling {0%{transform:scale(1);box-shadow:0 0 0 rgba(19,194,242,0);}50%{transform:scale(1.08);box-shadow:0 0 18px rgba(19,194,242,0.8);}100%{transform:scale(1);box-shadow:0 0 0 rgba(19,194,242,0);}}
@keyframes selected-pop {0%{transform:scale(1);box-shadow:0 0 0 rgba(19,119,235,0);}50%{transform:scale(1.12);box-shadow:0 0 28px rgba(19,119,235,0.9);}100%{transform:scale(1.06);box-shadow:0 0 20px rgba(19,119,235,0.6);}}
.map-item.rolling {animation:rolling 0.18s ease;}
.map-item.selected {animation:selected-pop 0.5s ease forwards;z-index:2;}
.map-item.drawn {opacity:0.35;filter:grayscale(1);pointer-events:none;}

/* Toast 提示 - 居中醒目 */
.toast {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) scale(0.8);
  background:rgba(19,119,235,0.95);
  color:#fff;
  padding:20px 36px;
  border-radius:14px;
  font-size:20px;
  font-weight:bold;
  z-index:9999;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.25s,transform 0.25s;
  box-shadow:0 8px 40px rgba(19,119,235,0.5);
  text-shadow:0 1px 2px rgba(0,0,0,0.2);
  letter-spacing:1px;
}
.toast.show {
  opacity:1;
  transform:translate(-50%, -50%) scale(1);
}
.toast.warning {
  background:rgba(224,32,32,0.95);
  box-shadow:0 8px 40px rgba(224,32,32,0.5);
}

/* 确认弹窗遮罩 */
.modal-overlay {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:9998;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.25s;
}
.modal-overlay.show {
  opacity:1;
  pointer-events:auto;
}

/* 确认弹窗 */
.modal-box {
  background:#fff;
  border-radius:16px;
  padding:28px 32px 20px;
  width:340px;
  text-align:center;
  box-shadow:0 8px 40px rgba(0,0,0,0.25);
  transform:scale(0.9);
  transition:transform 0.25s;
}
.modal-overlay.show .modal-box {
  transform:scale(1);
}
.modal-body {
  font-size:16px;
  color:#333;
  margin-bottom:22px;
  line-height:1.6;
}
.modal-btns {
  display:flex;
  gap:12px;
}
.modal-btn {
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
  font-size:15px;
  cursor:pointer;
  transition:0.2s;
}
.modal-btn.cancel {
  background:#f0f0f0;
  color:#666;
}
.modal-btn.cancel:hover {
  background:#e0e0e0;
}
.modal-btn.confirm {
  background:#13C2F2;
  color:#fff;
}
.modal-btn.confirm:hover {
  background:#0EA8E0;
}

/* ========== 模式选择页 ========== */
.mode-select {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  min-height:100vh;
  padding: 8vh 20px 20px;
}
.mode-select .trophy-title {
  font-size:42px;
  margin-bottom: 60px;
  width:100%;
  text-align:center;
}
.mode-select .header-contact {margin-bottom: 0;}
.mode-cards {
  display: grid;
  grid-template-columns: repeat(2, 220px);
  grid-template-rows: auto auto;
  gap: 20px;
  justify-content: center;
}
.mode-card {
  width: 220px;
  padding: 26px 22px;
  background:rgba(255,255,255,0.92);
  border:1.5px solid #B3E0FF;
  border-radius:14px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
  backdrop-filter:blur(6px);
}
a.mode-card {
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.mode-card:hover {
  transform:translateY(-4px);
  box-shadow:0 8px 24px rgba(19,194,242,0.3);
  border-color:#13C2F2;
}
.mode-icon {font-size:38px;margin-bottom:8px;}
.mode-name {font-size:20px;font-weight:bold;color:#1377EB;margin-bottom:8px;}
.mode-desc {font-size:12px;color:#888;line-height:1.5;}

/* ========== 管理后台入口 ========== */
.admin-entry {
  position: fixed;
  right: 20px;
  bottom: 20px;
  padding: 8px 18px;
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 20px;
  color: #fff;
  font-size: 13px;
  text-decoration: none;
  backdrop-filter: blur(6px);
  transition: 0.25s;
  z-index: 50;
}
.admin-entry:hover {
  background: rgba(255,255,255,0.32);
  border-color: rgba(255,255,255,0.6);
}

/* ========== 作者卡片 ========== */
.author-card {
  margin: 24px auto 0;
  max-width: 380px;
  padding: 18px 22px;
  background: rgba(255,255,255,0.22);
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 16px;
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  gap: 14px;
}
.author-card img.avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.6);
  flex-shrink: 0;
  background: rgba(255,255,255,0.3);
}
.author-card .a-info { flex: 1; min-width: 0; }
.author-card .a-name {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.25);
  margin-bottom: 2px;
}
.author-card .a-qq {
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  margin-bottom: 4px;
}
.author-card .a-desc {
  font-size: 12px;
  color: rgba(255,255,255,0.75);
  line-height: 1.5;
}

/* ========== 返回按钮 ========== */
.back-btn {
  display:inline-block;
  margin-top:8px;
  padding:6px 16px;
  background:#1377EB;
  color:#fff;
  border:none;
  border-radius:20px;
  font-size:13px;
  cursor:pointer;
  transition:0.2s;
}
.back-btn:hover {background:#0D5FC5;}

/* ========== 排行榜 ========== */
.rank-board-item {
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
  margin-bottom:8px;
  background:#F7FCFF;
  border-radius:10px;
  border:1px solid #E6F7FF;
}
.rank-num {
  width:30px;height:30px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:14px;
  color:#fff;
}
.rank-num.top1 {background:#FFB800;}
.rank-num.top2 {background:#A0A0A0;}
.rank-num.top3 {background:#CD7F32;}
.rank-num.normal {background:#B3E0FF;color:#1377EB;}
.rank-name {flex:1;font-size:15px;font-weight:bold;color:#333;}
.rank-score {font-size:18px;font-weight:bold;color:#13C2F2;}

/* 模式显隐 */
.jifen-only, .dixue-only {display:none;}
.mode-jifen .jifen-only {display:block;}
.mode-dixue .dixue-only {display:block;}

/* ========== 滴血赛侧边栏 ========== */
.dixue-player-card {
  background:#F7FCFF;
  border:1px solid #E6F7FF;
  border-radius:10px;
  padding:12px;
  margin-bottom:8px;
}
.dixue-player-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.dixue-player-name {
  font-size:15px;
  font-weight:bold;
  color:#1377EB;
}
.dixue-player-score {
  font-size:16px;
  font-weight:bold;
  color:#E02020;
}
.dixue-player-maps {
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}
.dixue-map-tag {
  background:#E6F7FF;
  color:#1377EB;
  padding:2px 8px;
  border-radius:12px;
  font-size:11px;
}
.dixue-no-map {
  color:#bbb;
  font-size:12px;
}

/* ========== Header 联系方式 ========== */
.header-contact {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 16px;
  margin-bottom: 4px;
}
.header-contact .contact-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 40px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  text-decoration: none;
  background: #00BFFF;
  color: #fff;
  border: none;
  cursor: pointer;
  transition: 0.25s;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}
.header-contact .contact-link .qq-icon {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}
.header-contact .contact-link:hover {
  background: #33CCFF;
  transform: translateY(-2px);
  box-shadow: 0 4px 15px rgba(0,191,255,0.4);
}

/* 链接卡片文字样式 */
a.mode-card .mode-name {
  color: #1377EB;
}

/* ========== 移动端适配 ========== */
@media (max-width: 1024px) {
  .main {
    flex-wrap: wrap;
  }
  .rank-sidebar {
    order: 2;
    width: 100%;
    max-height: none;
    position: static;
    padding: 12px;
  }
  .left {
    order: 3;
    flex: 1 1 100%;
    min-width: 0;
  }
  .right {
    order: 1;
    width: 100%;
  }
  .map-grid {
    grid-template-columns: repeat(4, 1fr);
  }
  .show-card {
    width: 240px;
    height: 140px;
  }
  .draw-btn {
    padding: 14px 24px;
    font-size: 16px;
  }
  .draw-box {
    gap: 16px;
  }
}

@media (max-width: 768px) {
  body {
    padding: 10px;
  }
  .trophy-title {
    font-size: 24px;
  }
  .sub-title {
    font-size: 13px;

<body>
    <script>
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });
    </script>
    <script src="config.js"></script>
    <script>
// ========== 配置读取（默认值来自 config.js，后台修改存于 localStorage） ==========
const CFG_KEY = 'qqspeed_tool_cfg_v1';
function deepMerge(base, over) {
  if (over === undefined || over === null) return base;
  if (Array.isArray(base) || Array.isArray(over)) return Array.isArray(over) ? over.slice() : base.slice();
  if (typeof base === 'object' && typeof over === 'object') {
    const out = Object.assign({}, base);
    for (const k of Object.keys(over)) {
      if (over[k] !== undefined) out[k] = deepMerge(base[k], over[k]);
    }
    return out;
  }
  return over;
}
function loadCfg() {
  const base = JSON.parse(JSON.stringify(window.QQS_DEFAULT_CFG || {}));
  try {
    const raw = localStorage.getItem(CFG_KEY);
    if (raw) return deepMerge(base, JSON.parse(raw));
  } catch (e) {}
  return base;
}
let CFG = loadCfg();
function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normMaps(arr) {
  // 自动到 assets/tu/ 找同名图（忽略名字里的空格差异，如 "9 年时光路" → "9年时光路.jpg"）
  // 找不到时由 <img onerror> 回退到占位图 dd.jpg
  const imgFor = name => 'assets/tu/' + String(name).replace(/\s+/g, '') + '.jpg';
  return (arr || []).map(m => typeof m === 'string'
    ? {name:m, img:imgFor(m)}
    : {name:m.name, img: (m.img ? m.img : imgFor(m.name))});
}

// ============== 地图数据（来自共享配置，可由管理后台修改） ==============
let allMaps   = normMaps(CFG.maps && CFG.maps.all);
let rankMaps  = normMaps(CFG.maps && CFG.maps.rank);
let matchMaps = normMaps(CFG.maps && CFG.maps.match);
let masterMaps = normMaps(CFG.maps && CFG.maps.master);

// ========== 全局状态 ==========
let gameMode = null;
let currentType = "all";
let currentMap = { name: "等待抽取", img: "assets/hou/dd.jpg" };
let players = [];
let selectedPlayerIndex = -1;
let isRolling = false;
let drawnMaps = new Set();
let mapRepeat = false; // 积分赛「地图可重复」：勾选后抽完地图不移出地图池
// 积分赛快捷分值按钮：5 个加分值 + 1 个扣分值（0 = 隐藏该按钮），可在面板设置中自定义
let jifenAddVals = [1,2,3,4,5];
let jifenSubVal = 1;

// ========== 应用初始化（在 HTML 片段加载完毕后调用） ==========
async function initApp() {

// DOM
const modeSelect      = document.getElementById("modeSelect");
const mainContent     = document.getElementById("mainContent");
const modeTitle       = document.getElementById("modeTitle");
const panelTitle      = document.getElementById("panelTitle");
const backToMode      = document.getElementById("backToMode");
const rankBoard       = document.getElementById("rankBoard");
const dixueSidebar    = document.getElementById("dixueSidebar");
const mapGrid         = document.getElementById("mapGrid");
const mapCount        = document.getElementById("mapCount");
const drawBtn         = document.getElementById("drawBtn");
const showImg         = document.getElementById("showImg");
const showName        = document.getElementById("showName");
const filterBtns      = document.querySelectorAll(".filter-btn");
const playerInput     = document.getElementById("playerInput");
const addPlayerBtn    = document.getElementById("addPlayer");
const playerList      = document.getElementById("playerList");
const resetAllBtn     = document.getElementById("resetAll");

// Toast & Modal
const toast           = document.getElementById("toast");
let toastTimer        = null;
const modalOverlay    = document.getElementById("modalOverlay");
const modalBody       = document.getElementById("modalBody");
const modalCancel     = document.getElementById("modalCancel");
const modalConfirm    = document.getElementById("modalConfirm");
// 弹窗按钮默认行为：关闭弹窗（showConfirm 调用时会覆写为确认/取消逻辑）
modalCancel.onclick = () => modalOverlay.classList.remove("show");
modalConfirm.onclick = () => modalOverlay.classList.remove("show");

// ========== 首页渲染（标题 + 功能卡片，内容来自后台配置） ==========
function renderHome() {
  const t = document.getElementById('homeTitle');
  if (t) t.textContent = CFG.homeTitle || 'QQ飞车小工具';
  const box = document.getElementById('modeCards');
  if (!box) return;
  box.innerHTML = '';
  (CFG.cards || []).forEach(c => {
    if (c.visible === false) return;
    const icon = escHtml(c.icon || '');
    const name = escHtml(c.name || '');
    const desc = (c.desc || '').replace(/\n/g, '<br>');
    const inner = `<div class="mode-icon">${icon}</div><div class="mode-name">${name}</div>${desc ? `<div class="mode-desc">${desc}</div>` : ''}`;
    if (c.type === 'mode' && c.mode) {
      box.insertAdjacentHTML('beforeend', `<div class="mode-card" data-mode="${escHtml(c.mode)}">${inner}</div>`);
    } else {
      const href = escHtml(c.link || '#');
      box.insertAdjacentHTML('beforeend', `<a class="mode-card" href="${href}" target="_blank" rel="noopener">${inner}</a>`);
    }
  });
  // 作者卡片
  const abox = document.getElementById('authorBox');
  if (abox) {
    const a = CFG.author || {};
    if (a.qq) {
      const avatar = `https://q.qlogo.cn/g?b=qq&nk=${encodeURIComponent(a.qq)}&s=100`;
      abox.innerHTML = `<div class="author-card">
        <img class="avatar" src="${avatar}" alt="头像" onerror="this.style.display='none'">
        <div class="a-info">
          <div class="a-name">${escHtml(a.name || '作者')}</div>
          <div class="a-qq">QQ：${escHtml(a.qq)}</div>
          ${a.desc ? `<div class="a-desc">${escHtml(a.desc)}</div>` : ''}
        </div>
      </div>`;
    } else {
      abox.innerHTML = '';
    }
  }
}
renderHome();

// ========== 模式选择 ==========
document.querySelectorAll(".mode-card").forEach(card => {
  card.onclick = () => {
    gameMode = card.dataset.mode;
    enterMode();
  };
});

function enterMode() {
  modeSelect.style.display = "none";
  mainContent.style.display = "block";
  mainContent.className = "mode-" + gameMode;
  const cfgCard = (CFG.cards || []).find(c => c.type === "mode" && c.mode === gameMode);
  const modeName = cfgCard && cfgCard.name ? cfgCard.name : (gameMode === "dixue" ? "滴血赛" : "积分赛");
  const modeIcon = cfgCard && cfgCard.icon ? cfgCard.icon : (gameMode === "dixue" ? "🩸" : "🏆");
  modeTitle.innerText = modeName;
  panelTitle.innerHTML = modeIcon + " " + modeName + (gameMode === "jifen"
    ? ' <button id="scoreSettingsBtn" class="score-settings-btn" title="自定义分值按钮">⚙</button>' : '');
  if (gameMode === "jifen") {
    document.getElementById("scoreSettingsBtn").onclick = openScoreSettings;
  }
  renderMapList();
  if (gameMode === "jifen") renderRankBoard();
  if (gameMode === "dixue") renderDixueSidebar();
  renderPlayers();
}

backToMode.onclick = async () => {
  let ok = await showConfirm("返回首页将清空数据！");
  if (!ok) return;
  players = []; selectedPlayerIndex = -1; drawnMaps.clear();
  currentMap = {name:"等待抽取",img:"assets/hou/dd.jpg"};
  showImg.src = "assets/hou/dd.jpg";
  showName.innerText = "等待抽取";
  gameMode = null;
  modeSelect.style.display = "";
  mainContent.style.display = "none";
  filterBtns.forEach(x => x.classList.remove("active"));
  filterBtns[0].classList.add("active");
  currentType = "all";
};

// ========== 排行榜（积分赛） ==========
function renderRankBoard() {
  if (!rankBoard) return;
  if (!players.length) {
    rankBoard.innerHTML = '<div style="text-align:center;color:#aaa;padding:40px 0;">暂无选手数据</div>';
    return;
  }
  let sorted = [...players].sort((a, b) => b.score - a.score);
  rankBoard.innerHTML = sorted.map((p, i) => {
    let rankClass = i === 0 ? "top1" : i === 1 ? "top2" : i === 2 ? "top3" : "normal";
    return `<div class="rank-board-item">
      <div class="rank-num ${rankClass}">${i + 1}</div>
      <div class="rank-name">${p.name}</div>
      <div class="rank-score">${p.score} 分</div>
    </div>`;
  }).join("");
}

// ========== 滴血赛侧边栏 ==========
function renderDixueSidebar() {
  if (!dixueSidebar) return;
  if (!players.length) {
    dixueSidebar.innerHTML = '<div style="text-align:center;color:#aaa;padding:40px 0;">暂无选手数据</div>';
    return;
  }
  dixueSidebar.innerHTML = players.map(p => {
    let mapsText = p.maps.length > 0 ? p.maps.map(m => `<span class="dixue-map-tag">${m}</span>`).join('') : '<span class="dixue-no-map">暂无选图</span>';
    return `<div class="dixue-player-card">
      <div class="dixue-player-header">
        <span class="dixue-player-name">${p.name}</span>
        <span class="dixue-player-score">${p.score} 分</span>
      </div>
      <div class="dixue-player-maps">${mapsText}</div>
    </div>`;
  }).join("");
}

// ========== Toast & Modal ==========
function showToast(msg, type = "info") {
  toast.textContent = msg;
  toast.classList.remove("warning");
  if (type === "warning") toast.classList.add("warning");
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}

function showConfirm(msg) {
  return new Promise(resolve => {
    modalBody.textContent = msg;
    modalOverlay.classList.add("show");
    modalConfirm.onclick = () => { modalOverlay.classList.remove("show"); resolve(true); };
    modalCancel.onclick = () => { modalOverlay.classList.remove("show"); resolve(false); };
    modalOverlay.onclick = (e) => { if(e.target === modalOverlay) { modalOverlay.classList.remove("show"); resolve(false); } };
  });
}

// ========== 积分赛分值按钮自定义弹窗 ==========
let scoreSetBound = false;
function openScoreSettings() {
  const overlay = document.getElementById("scoreSetOverlay");
  // 用当前状态填充输入框
  document.querySelectorAll("#addValGrid .add-val-input").forEach((inp, i) => {
    inp.value = jifenAddVals[i] != null ? jifenAddVals[i] : 0;
  });
  document.getElementById("subValInput").value = jifenSubVal;
  overlay.classList.add("show");
  if (!scoreSetBound) {
    scoreSetBound = true;
    document.getElementById("scoreSetCancel").onclick = () => overlay.classList.remove("show");
    document.getElementById("scoreSetOk").onclick = () => {
      jifenAddVals = [...document.querySelectorAll("#addValGrid .add-val-input")]
        .map(inp => Math.max(0, parseInt(inp.value, 10) || 0));
      jifenSubVal = Math.max(0, parseInt(document.getElementById("subValInput").value, 10) || 0);
      overlay.classList.remove("show");
      renderPlayers();
    };
    overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove("show"); };
  }
}

// ========== 渲染地图 ==========
// 地图按名称 A-Z（中文拼音）排序；数字开头在前、英文在后
const pinyinColl = new Intl.Collator("zh-Hans-CN", {sensitivity:"base", numeric:true});
function getPool(type) {
  let list = type === "all" ? allMaps : type === "match" ? matchMaps : type === "rank" ? rankMaps : masterMaps;
  return list.slice().sort((a,b) => pinyinColl.compare(a.name, b.name));
}
function renderMapList() {
  let list = getPool(currentType);

  // 积分赛勾选「地图可重复」时，已抽地图不移出地图池（视为全部可用）
  let exclude = (gameMode === "jifen" && mapRepeat) ? new Set() : drawnMaps;
  let available = list.filter(m => !exclude.has(m.name));
  mapGrid.innerHTML = "";
  mapCount.innerText = `剩余：${available.length} / ${list.length}`;
  list.forEach(m => {
    let drawn = exclude.has(m.name);
    let div = document.createElement("div");
    div.className = "map-item" + (drawn ? " drawn" : "");
    div.innerHTML = `<img src="${m.img}" onerror="this.onerror=null;this.src='assets/hou/dd.jpg'"><div class="text">${m.name}</div>`;
    mapGrid.appendChild(div);
  });
}
// 积分赛「地图可重复」开关：切换后立即刷新地图池显示
document.getElementById("mapRepeat").onchange = function(e) {
  mapRepeat = e.target.checked;
  renderMapList();
};

// ========== 抽取地图 ==========
drawBtn.onclick = () => {
  if (isRolling) return;

  isRolling = true;
  drawBtn.disabled = true;
  let fullPool = getPool(currentType);
  let exclude = (gameMode === "jifen" && mapRepeat) ? new Set() : drawnMaps;
  let pool = fullPool.filter(m => !exclude.has(m.name));
  if (!pool.length) { showToast("当前分类地图已全部抽取完毕！"); isRolling = false; drawBtn.disabled = false; return; }

  let items = [...document.querySelectorAll(".map-item")];
  let availableItems = items.filter((_, i) => !exclude.has(fullPool[i].name));
  let lastIdx = -1;

  let c = 0, speed = 60, animTimer = null;
  function tick() {
    if (lastIdx >= 0) items[lastIdx].classList.remove("rolling");
    let randItem = availableItems[Math.floor(Math.random() * availableItems.length)];
    let mapIdx = items.indexOf(randItem);
    let r = fullPool[mapIdx];
    showImg.src = r.img || 'assets/hou/dd.jpg';
    showName.innerText = r.name;
    randItem.classList.add("rolling");
    lastIdx = mapIdx;
    c++;
    if (c > 8 && speed < 150) speed += 6;
    if (c > 18 && speed < 300) speed += 12;
    if (c > 28 && speed < 500) speed += 25;

    if (c > 35) {
      items[mapIdx].classList.remove("rolling");
      items[mapIdx].classList.add("selected");
      currentMap = r;
      if (!(gameMode === "jifen" && mapRepeat)) drawnMaps.add(r.name);
      if (gameMode === "dixue") {
        if (selectedPlayerIndex === -1) { showToast("请先选择一名选手！", "warning"); isRolling = false; drawBtn.disabled = false; items[mapIdx].classList.remove("selected"); return; }
        players[selectedPlayerIndex].maps.push(currentMap.name);
      }
      setTimeout(() => { items[mapIdx].classList.remove("selected"); }, 1000);
      isRolling = false;
      drawBtn.disabled = false;
      renderMapList();
      renderPlayers();
    } else {
      animTimer = setTimeout(tick, speed);
    }
  }
  tick();
};

// ========== 切换分类 ==========
filterBtns.forEach(b => {
  b.onclick = () => {
    filterBtns.forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    currentType = b.dataset.t;
    renderMapList();
    renderPlayers();
  };
});

// ========== 渲染选手 ==========
function renderPlayers() {
  playerList.innerHTML = "";
  players.forEach((p, idx) => {
    let mapHTML = p.maps.length > 0
      ? p.maps.map((m, mi) => `<div class="map-row"><span>• ${m}</span><button class="del-map" data-action="delMap" data-idx="${idx}" data-mi="${mi}">×</button></div>`).join('')
      : '';
    let currentPool = currentType === "all" ? allMaps : currentType === "match" ? matchMaps : currentType === "rank" ? rankMaps : masterMaps;
    let mapSection = gameMode === "dixue" ? `
      <input class="manual-map" data-idx="${idx}" list="mapDatalist${idx}" placeholder="输入或选择地图" autocomplete="off">
      <datalist id="mapDatalist${idx}">
        ${currentPool.map(m => `<option value="${m.name}">`).join('')}
      </datalist>
      <button class="add-manual-btn" data-action="addMap" data-idx="${idx}">确认添加此地图</button>
      <div class="map-history">${mapHTML}</div>
    ` : '';
    let div = document.createElement("div");
    div.className = "player-item " + (idx === selectedPlayerIndex ? "active" : "");
    div.innerHTML = `
      <div class="player-name" data-action="select" data-idx="${idx}">
        <span>${p.name}</span>
        <span>分数：${p.score}</span>
      </div>
      <div class="btn-row">
        ${gameMode === "jifen" ? `
        ${jifenAddVals.map(v => v > 0
          ? `<button class="add" data-action="addScore" data-idx="${idx}" data-val="${v}">+${v}分</button>` : '').join('')}
        ${jifenSubVal > 0
          ? `<button class="sub" data-action="subScoreVal" data-idx="${idx}" data-val="${jifenSubVal}">-${jifenSubVal}分</button>` : ''}
        ` : `
        <button class="add" data-action="addScore1" data-idx="${idx}">+1分</button>
        <button data-action="subScore" data-idx="${idx}">-1分</button>
        `}
        <button class="del" data-action="delPlayer" data-idx="${idx}">删除</button>
      </div>
      ${mapSection}
    `;
    playerList.appendChild(div);
  });
  if (gameMode === "jifen") renderRankBoard();
  if (gameMode === "dixue") renderDixueSidebar();
}

// ========== 事件委托（选手操作） ==========
playerList.onclick = function(e) {
  let target = e.target.closest("[data-action]");
  if (!target) return;
  let action = target.dataset.action;
  let idx = parseInt(target.dataset.idx);

  if (action === "select") {
    selectedPlayerIndex = idx;
    renderPlayers();
  }
  else if (action === "addScore") { players[idx].score += parseInt(target.dataset.val, 10) || 0; renderPlayers(); }
  else if (action === "subScoreVal") {
    players[idx].score = Math.max(0, players[idx].score - (parseInt(target.dataset.val, 10) || 0));
    renderPlayers();
  }
  else if (action === "addScore1") { players[idx].score += 1; renderPlayers(); }
  else if (action === "addScore2") { players[idx].score += 2; renderPlayers(); }
  else if (action === "addScore3") { players[idx].score += 3; renderPlayers(); }
  else if (action === "addScore4") { players[idx].score += 4; renderPlayers(); }
  else if (action === "addScore5") { players[idx].score += 5; renderPlayers(); }
  else if (action === "subScore") { players[idx].score = Math.max(0, players[idx].score - 1); renderPlayers(); }
  else if (action === "delPlayer") {
    let removedMaps = players[idx].maps;
    players.splice(idx, 1);
    if (selectedPlayerIndex === idx) selectedPlayerIndex = -1;
    else if (selectedPlayerIndex > idx) selectedPlayerIndex--;
    removedMaps.forEach(m => {
      if (!players.some(p => p.maps.includes(m))) drawnMaps.delete(m);
    });
    renderMapList();
    renderPlayers();
  }
  else if (action === "addMap") {
    let input = document.querySelector(`.manual-map[data-idx="${idx}"]`);
    let mapName = input ? input.value.trim() : "";
    if (!mapName) { showToast("请输入或选择地图", "warning"); return; }
    let currentPool = currentType === "all" ? allMaps : currentType === "match" ? matchMaps : currentType === "rank" ? rankMaps : masterMaps;
    if (!currentPool.some(m => m.name === mapName)) { showToast("该地图不在当前地图池中", "warning"); return; }
    let existingPlayer = players.find(p => p.maps.includes(mapName));
    if (existingPlayer) { showToast(`该地图已被 ${existingPlayer.name} 选取`, "warning"); return; }
    players[idx].maps.push(mapName);
    drawnMaps.add(mapName);
    input.value = "";
    renderMapList();
    renderPlayers();
  }
  else if (action === "delMap") {
    let mi = parseInt(target.dataset.mi);
    let removedMap = players[idx].maps[mi];
    players[idx].maps.splice(mi, 1);
    if (!players.some(p => p.maps.includes(removedMap))) drawnMaps.delete(removedMap);
    renderMapList();
    renderPlayers();
  }
};

// 添加选手
addPlayerBtn.onclick = () => {
  let name = playerInput.value.trim();
  if (!name) return showToast("请输入姓名");
  if (players.length >= 10) return showToast("最多10人");
  if (players.some(p => p.name === name)) return showToast("选手名已存在，请使用不同名称", "warning");
  let initScore = parseInt(document.getElementById("initScore").value) || 0;
  players.push({ name, score: Math.max(0, initScore), maps: [] });
  playerInput.value = "";
  renderPlayers();
};

// 重置
resetAllBtn.onclick = async () => {
  let ok = await showConfirm("确定清空所有数据吗？此操作不可恢复。");
  if (!ok) return;
  players = []; selectedPlayerIndex = -1; drawnMaps.clear();
  currentMap = {name:"等待抽取",img:"assets/hou/dd.jpg"};
  showImg.src = "assets/hou/dd.jpg";
  showName.innerText = "等待抽取";
  renderMapList();
  if (gameMode === "jifen") renderRankBoard();
  if (gameMode === "dixue") renderDixueSidebar();
  renderPlayers();
};

// 导出数据
document.getElementById("exportData").onclick = () => {
  if (!players.length) { showToast("暂无数据可导出"); return; }
  let now = new Date().toLocaleString("zh-CN");
  let text = `QQ飞车赛事计分 - ${now}\n${"=".repeat(30)}\n\n`;
  players.sort((a, b) => b.score - a.score).forEach((p, i) => {
    text += `${i + 1}. ${p.name}  分数：${p.score}\n`;
    text += `   跑图记录：${p.maps.length ? p.maps.join("、") : "无"}\n\n`;
  });
  let blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `计分数据_${now.replace(/[/:]/g, "-").replace(/\s/g, "_")}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast("数据已导出");
};

// ========== QQ好友按钮 ==========
function copyAndRedirect(qqNumber) {
  var input = document.createElement('input');
  input.value = qqNumber;
  document.body.appendChild(input);
  input.select();
  document.execCommand('copy');
  document.body.removeChild(input);
  showConfirm('QQ号码已复制，是否跳转添加好友？').then(function(ok) {
    if (ok) window.open('https://wpa.qq.com/msgrd?v=3&uin=' + qqNumber + '&site=qq&menu=yes', '_blank');
  });
}
document.querySelectorAll('.addFriendBtn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    copyAndRedirect('973756295');
  });
});
